<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光伏电站融资置换 · 智能测算</title>
<style>
  :root{
    --brand:#0e7c66; --brand2:#13a07f; --ink:#1f2a30; --muted:#6b7a82;
    --line:#e3e9ec; --bg:#f4f7f6; --card:#fff; --warn:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;}
  .wrap{max-width:1040px;margin:0 auto;padding:18px;}
  header.top{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:14px;
    padding:22px 24px;margin-bottom:18px;box-shadow:0 6px 20px rgba(14,124,102,.18);}
  header.top h1{margin:0 0 6px;font-size:22px;letter-spacing:.5px}
  header.top p{margin:0;opacity:.92;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.03);}
  .card h2{margin:0 0 14px;font-size:16px;color:var(--brand);border-left:4px solid var(--brand);padding-left:10px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1 / -1}
  label{font-size:13px;color:var(--muted)}
  label b{color:var(--ink)}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;
    background:#fbfdfc;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(19,160,127,.12)}
  .hint{font-size:11px;color:var(--muted);margin-top:2px}
  .btn{display:inline-block;border:none;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:600;
    cursor:pointer;transition:.15s;background:var(--brand);color:#fff;}
  .btn:hover{background:var(--brand2)}
  .btn.ghost{background:#eef4f2;color:var(--brand);border:1px solid var(--line)}
  .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .collapse{font-size:13px;color:var(--brand);cursor:pointer;user-select:none;margin:10px 0 4px;display:inline-block}
  details.params{margin-top:8px}
  details.params>summary{font-size:13px;color:var(--brand);cursor:pointer}
  .err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}

  /* ===== 报告 ===== */
  #report{display:none}
  .doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px 34px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .doc h1{font-size:21px;text-align:center;margin:0 0 4px}
  .doc .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
  .doc h2{font-size:16px;color:var(--brand);margin:22px 0 10px;border-left:4px solid var(--brand);padding-left:9px}
  .doc ul{margin:6px 0 6px;padding-left:20px}
  .doc li{margin:5px 0;font-size:14px}
  .doc p{font-size:14px;margin:8px 0}
  .kv{background:#f6faf9;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;font-size:14px}
  .kv b{color:var(--brand)}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:center}
  thead th{background:var(--brand);color:#fff;font-weight:600}
  tbody tr:nth-child(even){background:#f6faf9}
  td.lbl{text-align:left;color:var(--ink);font-weight:600;background:#eef4f2}
  .cta{margin-top:26px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:12px;
    padding:20px 22px;text-align:center}
  .cta h3{margin:0 0 6px;font-size:17px}
  .cta p{margin:4px 0;font-size:14px;opacity:.96}
  .cta .wx{font-size:20px;font-weight:700;letter-spacing:1px;margin:8px 0}
  .cta img{max-width:150px;background:#fff;border-radius:8px;margin-top:8px}
  .tag{display:inline-block;font-size:11px;background:#eef4f2;color:var(--brand);border:1px solid var(--line);
    border-radius:20px;padding:2px 10px;margin-left:6px;vertical-align:middle}
  .footer-note{font-size:11px;color:var(--muted);margin-top:18px;text-align:center}
  @media (max-width:680px){.grid{grid-template-columns:1fr}.doc{padding:20px 16px}}
  @media print{
    body{background:#fff}.wrap{max-width:none;padding:0}
    header.top,.card.form,.actions,.footer-note,.no-print{display:none!important}
    #report{display:block!important}.doc{border:none;box-shadow:none;padding:0}
    .cta{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top no-print">
    <h1>光伏电站存量融资置换 · 智能测算</h1>
    <p>填入您现有的光伏电站贷款信息，30 秒生成专属「融资置换与资产盘活方案」</p>
  </header>

  <!-- ============ 表单 ============ -->
  <div class="card form no-print">
    <h2>① 基本信息</h2>
    <div class="grid">
      <div class="field"><label>客户名称 <b>*</b></label><input id="custName" placeholder="如：智晨"></div>
      <div class="field"><label>项目名称 <b>*</b></label><input id="projName" placeholder="如：昂利泰—奥美森 4.416MW"></div>
    </div>

    <h2 style="margin-top:18px">② 现有贷款信息（原融资模式）</h2>
    <div class="grid">
      <div class="field"><label>融资机构</label><input id="oldOrg" placeholder="如：创佳"></div>
      <div class="field"><label>数量（兆瓦 MW） <b>*</b></label><input id="oldMw" type="number" step="0.001" placeholder="如：4.416"></div>
      <div class="field"><label>融资金额（万元） <b>*</b></label><input id="oldAmt" type="number" step="0.01" placeholder="如：915"></div>
      <div class="field"><label>剩余本金（万元） <b>*</b></label><input id="oldBalance" type="number" step="0.01" placeholder="如：825"></div>
      <div class="field"><label>融资年化利率（%） <b>*</b></label><input id="oldRate" type="number" step="0.01" placeholder="如：8"></div>
      <div class="field"><label>还款方式</label>
        <select id="oldRepay"><option value="emi">等额本息</option><option value="epp">等额本金</option></select>
      </div>
      <div class="field"><label>融资年限（年） <b>*</b></label><input id="oldYears" type="number" step="1" placeholder="如：10"></div>
      <div class="field"><label>年电费收入（万元） <b>*</b></label><input id="oldAnnual" type="number" step="0.01" placeholder="如：167.808"></div>
      <div class="field"><label>融资保证金（万元）</label><input id="oldDeposit" type="number" step="0.01" placeholder="如：41.25"></div>
      <div class="field"><label>提前还款违约金（万元）</label><input id="oldPenalty" type="number" step="0.01" placeholder="如：0"></div>
    </div>

    <details class="params no-print">
      <summary>③ 新方案参数（我司标准，可微调）</summary>
      <div class="grid" style="margin-top:10px">
        <div class="field"><label>新融资年化利率（%）</label><input id="newRate" type="number" step="0.01" value="4"></div>
        <div class="field"><label>新融资年限（年）</label><input id="newYears" type="number" step="1" placeholder="默认同原年限"></div>
        <div class="field"><label>新融资金额（万元）</label><input id="newAmt" type="number" step="0.01" placeholder="默认=剩余本金；想多融改大"></div>
        <div class="field"><label>服务费比例（% of 新融资额）</label><input id="svcRate" type="number" step="0.1" value="5"></div>
        <div class="field"><label>评估费（万元）</label><input id="evalFee" type="number" step="0.01" value="2"></div>
        <div class="field"><label>管理费率（% of 年电费×年限）</label><input id="mgmtRate" type="number" step="0.1" value="2.5"></div>
        <div class="field"><label>运维费（万元 / MW / 年）</label><input id="opexRate" type="number" step="0.1" value="1"></div>
        <div class="field"><label>新融资保证金（万元）</label><input id="newDeposit" type="number" step="0.01" placeholder="默认同原保证金"></div>
        <div class="field"><label>新提前还款违约金（万元）</label><input id="newPenalty" type="number" step="0.01" value="0"></div>
      </div>
      <p class="hint">提示：新融资金额填「剩余本金」即纯置换；想放大融资投建新站，把数字改大即可，系统自动算出多融金额与富余资金。</p>
    </details>

    <div class="actions">
      <button class="btn" id="genBtn">生成我的专属方案</button>
      <button class="btn ghost" id="exBtn">填示例数据</button>
      <button class="btn ghost" id="resetBtn">清空</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <!-- ============ 报告 ============ -->
  <div id="report">
    <div class="doc" id="doc"></div>
  </div>

  <p class="footer-note no-print">本工具为融资置换测算演示，数据仅在本机浏览器计算，不会上传任何服务器。</p>
</div>
<script src="app.js"></script>
</body>
</html>
